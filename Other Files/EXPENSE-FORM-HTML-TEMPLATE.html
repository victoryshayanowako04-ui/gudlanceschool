<!-- EXPENSE FORM HTML - Add this payment method field -->

<!-- Existing form fields -->
<div class="form-group">
    <label for="expCategory">Expense Category:</label>
    <select id="expCategory" required>
        <option value="">-- Select Category --</option>
        <option value="Maintenance">Maintenance</option>
        <option value="Utilities">Utilities</option>
        <option value="Supplies">Supplies</option>
        <option value="Transport">Transport</option>
        <option value="Other">Other</option>
    </select>
</div>

<div class="form-group">
    <label for="expDesc">Expense Description:</label>
    <input type="text" id="expDesc" placeholder="e.g., Printer paper, cleaning supplies" required>
</div>

<!-- 🛑 NEW: Payment Method Field - Add this! -->
<div class="form-group">
    <label for="expMethod">Payment Method:</label>
    <select id="expMethod" required>
        <option value="Cash">Cash (Physical Drawer)</option>
        <option value="EcoCash">EcoCash</option>
        <option value="Bank Transfer">Bank Transfer</option>
        <option value="Innbucks">Innbucks</option>
        <option value="Zipit">Zipit</option>
    </select>
</div>
<!-- End of NEW field -->

<div class="form-group">
    <label for="expAmt">Amount (USD):</label>
    <input type="number" id="expAmt" placeholder="0.00" step="0.01" required>
</div>

<div class="form-group">
    <label for="expSignedBy">Signed/Authorized By:</label>
    <input type="text" id="expSignedBy" placeholder="e.g., John Dube, Jane Smith" required>
</div>

<button onclick="window.addExpense()">➕ Record Expense</button>

<!-- CSS Styling (Optional) -->
<style>
    .form-group {
        margin-bottom: 15px;
        display: flex;
        flex-direction: column;
    }
    
    .form-group label {
        font-weight: bold;
        margin-bottom: 5px;
        color: #2c3e50;
    }
    
    .form-group input,
    .form-group select {
        padding: 8px;
        border: 1px solid #bdc3c7;
        border-radius: 4px;
        font-size: 14px;
        font-family: Arial, sans-serif;
    }
    
    .form-group select {
        background-color: #f5f5f5;
        cursor: pointer;
    }
    
    .form-group select:hover {
        background-color: #e8f4f8;
    }
    
    button {
        background-color: #27ae60;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
    }
    
    button:hover {
        background-color: #229954;
    }
</style>
